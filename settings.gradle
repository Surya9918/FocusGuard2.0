plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
include ':app'
rootProject.name = "FocusGuard"

setBinding(new Binding([gradle: this]))
evaluate(new File(
  settingsDir,
  'flutter_nudge/.android/include_flutter.groovy'
))
include ':flutter_nudge'
project(':flutter_nudge').projectDir = new File('flutter_nudge')
