pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'FocusGuard'
include ':app'

def flutterModule = file('flutter_nudge/.android/include_flutter.groovy')
if (!flutterModule.isFile()) {
    throw new GradleException('Run flutter pub get in flutter_nudge before building FocusGuard.')
}
apply from: flutterModule
